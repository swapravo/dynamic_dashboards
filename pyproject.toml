[project]
name = "hearthly-live"
version = "0.1.0"
description = "Static dashboards vs AI-built dynamic dashboards: a local teaching demo (SQLite + FastAPI + MCP)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "anyio==4.16.0",
    "httpx==0.28.1",
    "playwright==1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearthly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: Playwright browser tests (need `playwright install chromium`)"]
